<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Deals Market</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Navigation Bar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-bolt text-amber-500 text-2xl"></i>
                    <span class="text-xl font-bold tracking-tight text-gray-900">SmartDeals<span class="text-amber-500">Market</span></span>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="relative hidden md:block">
                        <input type="text" placeholder="Search deals..." class="w-64 pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent text-sm">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-sm"></i>
                    </div>
                    <button class="relative p-2 text-gray-600 hover:text-amber-500 transition">
                        <i class="fa-solid fa-cart-shopping text-xl"></i>
                        <span class="absolute top-0 right-0 bg-red-500 text-white text-xs w-4 h-4 rounded-full flex items-center justify-center">3</span>
                    </button>
                    <button class="p-2 text-gray-600 hover:text-amber-500 transition">
                        <i class="fa-solid fa-circle-user text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Wrapper -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Hero Section / Flash Announcement -->
        <div class="bg-gradient-to-r align-middle from-amber-500 to-orange-600 rounded-2xl p-6 md:p-10 text-white shadow-lg mb-8 relative overflow-hidden">
            <div class="relative z-10 max-w-md">
                <span class="bg-white/20 text-xs font-semibold px-2.5 py-1 rounded-full uppercase tracking-wider">Limited Time Only</span>
                <h1 class="text-3xl md:text-4xl font-extrabold mt-4 mb-2">Mega Flash Deals up to 70% Off!</h1>
                <p class="text-amber-100 text-sm md:text-base mb-6">Smart algorithms sourcing the absolute lowest prices on trending tech and essentials.</p>
                <div class="flex items-center gap-2 text-sm bg-black/10 w-fit px-4 py-2 rounded-lg font-mono">
                    <span>Ends In:</span>
                    <span id="countdown" class="font-bold text-amber-300">04h 12m 45s</span>
                </div>
            </div>
            <i class="fa-solid fa-tags absolute right-[-20px] bottom-[-20px] text-white/10 text-[12rem] pointer-events-none rotate-12"></i>
        </div>

        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Sidebar Filters -->
            <aside class="w-full lg:w-64 shrink-0">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 sticky top-24">
                    <h3 class="font-bold text-gray-900 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-amber-500"></i> Filter Deals
                    </h3>
                    
                    <!-- Categories -->
                    <div class="mb-6">
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Category</label>
                        <div class="space-y-2">
                            <label class="flex items-center text-sm font-medium text-gray-700 cursor-pointer">
                                <input type="checkbox" checked class="rounded border-gray-300 text-amber-500 focus:ring-amber-500 mr-2"> All Products
                            </label>
                            <label class="flex items-center text-sm font-medium text-gray-600 hover:text-gray-900 cursor-pointer">
                                <input type="checkbox" class="rounded border-gray-300 text-amber-500 focus:ring-amber-500 mr-2"> Electronics
                            </label>
                            <label class="flex items-center text-sm font-medium text-gray-600 hover:text-gray-900 cursor-pointer">
                                <input type="checkbox" class="rounded border-gray-300 text-amber-500 focus:ring-amber-500 mr-2"> Home & Kitchen
                            </label>
                            <label class="flex items-center text-sm font-medium text-gray-600 hover:text-gray-900 cursor-pointer">
                                <input type="checkbox" class="rounded border-gray-300 text-amber-500 focus:ring-amber-500 mr-2"> Apparel
                            </label>
                        </div>
                    </div>

                    <!-- Discount Range -->
                    <div class="mb-6">
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Min Discount</label>
                        <select class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-amber-500 focus:border-transparent">
                            <option>10% Off & More</option>
                            <option>30% Off & More</option>
                            <option>50% Off & More</option>
                        </select>
                    </div>

                    <button class="w-full bg-gray-900 text-white text-sm font-semibold py-2.5 rounded-lg hover:bg-gray-800 transition">
                        Apply Filters
                    </button>
                </div>
            </aside>

            <!-- Product Grid Container -->
            <section class="flex-1">
                <!-- Sorting Bar -->
                <div class="flex justify-between items-center mb-6">
                    <p class="text-sm text-gray-500"><span class="font-semibold text-gray-900">24</span> active deals found</p>
                    <select class="border border-gray-300 rounded-lg p-2 text-sm bg-white text-gray-700">
                        <option>Sort by: Hot Deals</option>
                        <option>Price: Low to High</option>
                        <option>Price: High to Low</option>
                        <option>Highest Discount</option>
                    </select>
                </div>

                <!-- Card Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    
                    <!-- Product Card 1 -->
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition group">
                        <div class="relative bg-gray-100 aspect-square flex items-center justify-center p-4">
                            <span class="absolute top-3 left-3 bg-red-500 text-white font-bold text-xs px-2.5 py-1 rounded-md z-10">-40%</span>
                            <button class="absolute top-3 right-3 w-8 h-8 bg-white/80 rounded-full flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-white shadow-sm transition z-10">
                                <i class="fa-regular fa-heart"></i>
                            </button>
                            <!-- Simulated Placeholder Image Icon -->
                            <i class="fa-solid fa-laptop text-6xl text-gray-300 group-hover:scale-105 transition-transform duration-300"></i>
                        </div>
                        <div class="p-5">
                            <span class="text-xs font-semibold uppercase tracking-wider text-amber-600">Electronics</span>
                            <h4 class="font-bold text-gray-900 mt-1 mb-2 line-clamp-1">Smart Pro Wireless Laptop 14"</h4>
                            <div class="flex items-baseline gap-2 mb-4">
                                <span class="text-xl font-extrabold text-gray-900">$599.00</span>
                                <span class="text-sm text-gray-400 line-through">$999.00</span>
                            </div>
                            <button class="w-full bg-amber-500 hover:bg-amber-600 text-white font-semibold py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 transition text-sm">
                                <i class="fa-solid fa-cart-plus"></i> Claim Deal
                            </button>
                        </div>
                    </div>

                    <!-- Product Card 2 -->
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition group">
                        <div class="relative bg-gray-100 aspect-square flex items-center justify-center p-4">
                            <span class="absolute top-3 left-3 bg-red-500 text-white font-bold text-xs px-2.5 py-1 rounded-md z-10">-60%</span>
                            <button class="absolute top-3 right-3 w-8 h-8 bg-white/80 rounded-full flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-white shadow-sm transition z-10">
                                <i class="fa-regular fa-heart"></i>
                            </button>
                            <i class="fa-solid fa-headphones text-6xl text-gray-300 group-hover:scale-105 transition-transform duration-300"></i>
                        </div>
                        <div class="p-5">
